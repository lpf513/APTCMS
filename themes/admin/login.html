<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>后台登录</title></head>
<body>
  <h1>后台登录</h1>
  {if $error != ''}
    <p style="color:red;">{$error}</p>
  {/if}
  <form method="post" action="/admin/auth/login">
    <input type="hidden" name="_csrf" value="{$_csrf}">
    <p><label>用户名：<input type="text" name="username" required></label></p>
    <p><label>密码：<input type="password" name="password" required></label></p>
    <p><button type="submit">登录</button></p>
  </form>
  <p>默认账号：admin / aptcms123</p>
</body>
</html>
